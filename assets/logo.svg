<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-labelledby="t d">
  <title id="t">Blackbox</title>
  <desc id="d">Blackbox logo: an amber recorder box with a pulse line and a record dot, next to the word Blackbox.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241706"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="877" height="237" rx="26.5" fill="none" stroke="#ff9f1c" stroke-opacity="0.35" stroke-width="3"/>

  <!-- mark: recorder box with a pulse line and a record dot -->
  <g transform="translate(40 40)">
    <rect width="160" height="160" rx="36" fill="#150d03" stroke="#ff9f1c" stroke-width="4"/>
    <rect x="26" y="34" width="108" height="92" rx="16" fill="none" stroke="#ffd166" stroke-width="5"/>
    <path d="M40 84h20l10-26 20 52 14-36 8 10h12" fill="none" stroke="#ff9f1c" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="50" r="6" fill="#ff9f1c"/>
  </g>

  <!-- wordmark -->
  <text x="238" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="96" font-weight="700" letter-spacing="2" fill="url(#word)">Blackbox</text>
  <text x="242" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="26" fill="#c9b28a">$ what changed before this broke?<tspan fill="#ff9f1c">_</tspan></text>
</svg>
