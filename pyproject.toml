[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-recorder"
version = "0.1.0"
description = "Flight recorder for your computers: what changed before this broke?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Louis Boddie" }]
keywords = ["observability", "incident-response", "configuration", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
psutil = ["psutil>=5.9"]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "psutil>=5.9"]

[project.scripts]
blackbox = "blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blackbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
source = ["blackbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S603", "S607"]  # subprocess is used deliberately, with shell=False and argument lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/blackbox"]
