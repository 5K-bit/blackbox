name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Re-runs the full CI matrix on the tagged commit; nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Check release notes exist for this tag
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./venv/bin/blackbox --help
          ./venv/bin/python -c "import blackbox, pathlib; assert 'site-packages' in pathlib.Path(blackbox.__file__).parts"
          mkdir smoke && cd smoke
          ../venv/bin/blackbox init
          ../venv/bin/blackbox verify
      - name: Run the test suite against the installed wheel
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install pytest
          mkdir "$RUNNER_TEMP/tests-run" && cp -r tests examples "$RUNNER_TEMP/tests-run/"
          cd "$RUNNER_TEMP/tests-run"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests -q -p no:cacheprovider
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Decide whether this is a prerelease
        id: pre
        run: |
          # 0.x versions and any tag with a suffix (v1.0.0-rc1) are prereleases.
          if [[ "${GITHUB_REF_NAME}" == v0.* || "${GITHUB_REF_NAME}" == *-* ]]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ steps.pre.outputs.value }}
